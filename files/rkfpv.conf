# rkfpv config (/etc/rkfpv.conf). key = value, '#' starts a comment.
# Edit, then `killall -HUP rkfpv` to apply bitrate / max_bitrate / gop / rc /
# stat_time live. Everything else needs a restart.

# --- capture ---
size = 1280x720
fps = 30
iq_dir = /oem/usr/share/iqfiles
mirror = 1                  # mirror + flip = rotate 180° (camera mounted upside down)
flip = 1

# --- encoder (H.265) ---
# Link budget at MCS 2 / 20 MHz / FEC 8/12 is about 6 Mbps; stay well below.
rc = cbr
bitrate = 3500
# max_bitrate = 4500        # VBR only
gop = 30                    # 1 s at 30 fps: faster recovery after loss
stat_time = 1               # short RC window keeps per-second peaks down
slice_bytes = 0             # e.g. 1300: a lost packet then spoils one slice, not the whole frame
intra_refresh = 0           # e.g. 4: rolling intra rows instead of big IDR spikes

# --- output ---
dst = 127.0.0.1
port = 5600
pkt_size = 1400             # OpenIPC uses mlink - 100
stats = 5                   # print fps / kbps every N seconds, 0 = off
