# rkfpv config (/etc/rkfpv.conf). key = value, '#' starts a comment.
# Edit, then `killall -HUP rkfpv` to apply bitrate / max_bitrate / gop / rc /
# stat_time live. Everything else needs a restart.

# --- capture ---
size = 1280x720
fps = 30
iq_dir = /oem/usr/share/iqfiles
mirror = 1                  # mirror + flip = rotate 180° (camera mounted upside down)
flip = 1

# --- encoder (H.265) ---
# Link budget at MCS 2 / 20 MHz / FEC 8/12 is about 6 Mbps; stay well below.
rc = cbr
bitrate = 3500
# max_bitrate = 4500        # VBR only
gop = 30                    # 1 s at 30 fps: faster recovery after loss
stat_time = 1               # short RC window keeps per-second peaks down
slice_bytes = 0             # e.g. 1300: a lost packet then spoils one slice, not the whole frame
intra_refresh = 0           # e.g. 4: rolling intra rows instead of big IDR spikes

# --- output ---
dst = 127.0.0.1
port = 5600
pkt_size = 1400             # OpenIPC uses mlink - 100
# wired preview for the configurator: the link stream on 127.0.0.1, reached
# over USB with `adb forward tcp:5602 tcp:5602`. 0 = off
preview_port = 5602
stats = 5                   # print fps / kbps every N seconds, 0 = off
osd = 0                     # EXPERIMENTAL OSD burned into the video; off until tested on hardware

# --- image (ISP / rkaiq), applied live on `killall -HUP rkfpv` ---
# iq = keep the value from the IQ file (iq_dir above). See `fpv schema`.
isp_brightness = iq         # 0..255, 128 = neutral
isp_contrast = iq
isp_saturation = iq
isp_hue = iq
isp_sharpness = iq          # 0..100
isp_wb = auto               # auto daylight cloudy shade twilight fluorescent incandescent
isp_exp_max = iq            # ms, longest exposure: shorter = less motion blur (IQ: 30)
isp_gain_max = iq           # x (IQ: 512)
isp_antiflicker = iq        # off 50 60; off automatically when isp_exp_max < 10
isp_ae_delay = iq           # frames before AE reacts (IQ: 2)
isp_ae_damp = iq            # AE damping x0.01 (IQ: 0.45)
isp_blc = off               # backlight compensation 1..100
isp_hlc = off               # highlight compensation 1..100
isp_nr_spatial = off        # noise reduction off: no smearing on fast motion
isp_nr_temporal = off       # 3DNR off: no ghosting
isp_dehaze = iq             # off, 1..100

# --- DVR: recording to the TF card's DVR partition (/mnt/dvr) ---
# Start/stop any time with `fpv dvr start|stop` (or the configurator's button).
dvr = 0                     # 0 = DVR off, nothing allocated (default: RAM is tight); 1 = record from FPV start
dvr_segment = 600           # seconds per file; a new file starts at the next keyframe
dvr_min_free = 300          # MB kept free on the card
dvr_overwrite = 1           # 1: delete the oldest recordings when full, 0: stop recording
dvr_format = mp4            # mp4 (fragmented: still plays after a power cut) or ts
# The DVR records its own stream from the ISP main path; the link (size /
# bitrate above) uses the self path. dvr_size = link records the link stream.
dvr_size = link             # link = record the radio stream; 1920x1080 = own encoder (needs more RAM/CMA)
dvr_bitrate = 8000          # kbit/s
dvr_rc = vbr
dvr_gop = 30                # frames; MP4 keeps one GOP in RAM: keep it ~1 s
dvr_osd = 1                 # 0: no OSD in the recording (clean video for Gyroflow); needs dvr_size not link

# --- Betaflight blackbox over a UART (for Gyroflow) ---
# FC: a free UART set to "Blackbox logging", blackbox_device = SERIAL, same
# baud as below; its TX to the board's UART4 RX (GPIO1_C5), plus GND.
# Each arm is saved as rec_SSSS_NN.bbl next to the recording it belongs to.
# Check the wiring-free part first: UART4 TX to RX, `fpv blackbox selftest`.
blackbox = 0                # 1: run bblog with the video
blackbox_baud = 1500000     # 1000000 / 1500000 / 2000000
