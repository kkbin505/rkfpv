# Publishes web/ (the configurator UI) to GitHub Pages, into the app/ folder
# of the gh-pages branch (the landing page at the root stays):
#   https://<owner>.github.io/<repo>/app/
# The board's dvrhttpd answers CORS for https://<owner>.github.io only
# (WEB_ORIGIN in files/S99fpv; a fork sets its own in /etc/fpv/web_origin).
# Repo settings → Pages → Source: "Deploy from a branch", gh-pages, / (root).
name: Web configurator

on:
  push:
    branches: [main]
    paths: ["web/**", "configurator/presets/**", "configurator/build_site.py", "files/fpv", "files/S99fpv",
            "files/wfb.sh", "files/rkfpv.conf", "files/wfb.yaml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: python3 configurator/build_site.py _site --version "${GITHUB_SHA::12}"

      - name: Publish to gh-pages/app
        run: |
          git fetch --depth 1 origin gh-pages
          git worktree add pages FETCH_HEAD
          rm -rf pages/app
          cp -r _site pages/app
          cd pages
          git add -A app
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "app: configurator from ${GITHUB_SHA::12}"
          git push origin HEAD:gh-pages
